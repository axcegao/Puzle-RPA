<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle RPA - BI чат-бот</title>
<script src="/plotly.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; height: 100vh; }
header { background: #1e3a8a; color: #fff; padding: 12px 20px; }
header .logo { font-size: 18px; font-weight: 600; }
header .subtitle { font-size: 12px; opacity: .85; }
#feed { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 1100px; padding: 10px 14px; border-radius: 10px; background: #fff; border: 1px solid #e2e8f0; white-space: pre-wrap; font-size: 14px; }
.msg.user .bubble { background: #2563eb; color: #fff; border-color: #2563eb; white-space: normal; }
.bubble.typing { color: #64748b; font-style: italic; }
.dashboard { display: flex; flex-direction: column; gap: 12px; white-space: normal; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; }
.kpi { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 14px; min-width: 150px; }
.kpi .label { font-size: 11px; color: #64748b; }
.kpi .value { font-size: 20px; font-weight: 600; }
.kpi.good .value { color: #16a34a; }
.kpi.bad .value { color: #dc2626; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 13px; }
.filter { position: relative; }
.filter-btn { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; }
.filter-btn.active { border-color: #2563eb; color: #2563eb; }
.filter-panel { position: absolute; top: 32px; left: 0; z-index: 30; width: 280px; max-height: 300px; overflow-y: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 8px 20px rgba(15, 23, 42, .15); padding: 8px; }
.filter-panel input { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
.filter-panel label { display: flex; gap: 6px; align-items: flex-start; padding: 3px 4px; font-size: 13px; cursor: pointer; }
.filter-panel label input { flex: 0 0 14px; width: 14px; height: 14px; margin: 2px 0 0 0; }
.filter-panel label:hover { background: #f1f5f9; }
.select-option { display: block; width: 100%; text-align: left; padding: 6px 8px; border: none; background: none; font-size: 13px; cursor: pointer; border-radius: 4px; color: #0f172a; }
.select-option:hover { background: #f1f5f9; }
.select-option.selected { color: #2563eb; font-weight: 600; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
.chart { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px; min-width: 0; height: 360px; overflow: hidden; }
.bubble.dashboard { width: 100%; max-width: 1100px; }
.ctl-label { font-size: 12px; color: #64748b; }
.filter-panel label span { flex: 1; text-align: left; }
.summary { font-size: 13px; color: #334155; background: #f8fafc; border-left: 3px solid #2563eb; padding: 8px 10px; border-radius: 4px; }
.table-scroll { overflow: auto; max-height: 320px; max-width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; }
table { border-collapse: collapse; font-size: 12px; width: max-content; min-width: 100%; }
.bubble.table-msg { width: 100%; max-width: 1100px; overflow: hidden; }
th, td { border-bottom: 1px solid #e2e8f0; padding: 5px 8px; text-align: left; white-space: nowrap; }
th { background: #f8fafc; position: sticky; top: 0; }
details summary { cursor: pointer; font-size: 13px; color: #2563eb; padding: 4px 0; }
.dash-list { display: flex; flex-direction: column; gap: 6px; white-space: normal; }
.dash-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 10px; }
.dash-row button { padding: 4px 10px; border: 1px solid #2563eb; color: #2563eb; background: #fff; border-radius: 6px; cursor: pointer; }
a.file-link { color: #2563eb; font-size: 13px; }
footer { border-top: 1px solid #e2e8f0; background: #fff; padding: 10px 20px; }
.hints { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.hints button { padding: 4px 10px; font-size: 12px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 12px; cursor: pointer; }
#composer { display: flex; gap: 8px; }
#input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
#composer button { padding: 10px 18px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">Puzzle RPA</div>
  <div class="subtitle">BI чат-бот: интерактивные дашборды по текстовому запросу</div>
</header>
<main id="feed"></main>
<footer>
  <div class="hints" id="hints"></div>
  <form id="composer">
    <input id="input" placeholder="Напишите запрос, например: план-факт по регионам за последний год" autocomplete="off">
    <button type="submit">Отправить</button>
  </form>
</footer>
<script>
const DIM_LABELS = {region_name: "Регион", outlet_name: "Торговая точка", product_name: "Продукт",
                    category: "Категория", client_name: "Клиент", city: "Город", outlet_type: "Тип точки"};
const FILTER_ORDER = ["region_name", "city", "category", "client_name", "product_name", "outlet_name"];
const GRAN_LABELS = {month: "Месяцы", quarter: "Кварталы", year: "Годы"};
const state = {sessionId: null};
const feed = document.getElementById("feed");

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrollDown() { feed.scrollTop = feed.scrollHeight; }

function appendUser(text) {
  const msg = el("div", "msg user");
  msg.appendChild(el("div", "bubble", text));
  feed.appendChild(msg);
  scrollDown();
}

function appendBot() {
  const msg = el("div", "msg bot");
  const bubble = el("div", "bubble");
  msg.appendChild(bubble);
  feed.appendChild(msg);
  scrollDown();
  return bubble;
}

function fmtCell(value) {
  if (typeof value === "number") return value.toLocaleString("ru-RU", {maximumFractionDigits: 2});
  return value === null || value === undefined ? "" : String(value);
}

function renderTable(table, host) {
  const wrap = el("div", "table-scroll");
  const tbl = el("table");
  const thead = el("thead");
  const hr = el("tr");
  table.labels.forEach(label => hr.appendChild(el("th", null, label)));
  thead.appendChild(hr);
  tbl.appendChild(thead);
  const tbody = el("tbody");
  table.rows.forEach(row => {
    const tr = el("tr");
    row.forEach(cell => tr.appendChild(el("td", null, fmtCell(cell))));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  host.appendChild(wrap);
}

function kpiClass(kpi) {
  const num = parseFloat(String(kpi.value).replace(/\s/g, "").replace(",", "."));
  if (kpi.label.indexOf("Выполнение") === 0) return num >= 100 ? "good" : "bad";
  if (kpi.label.indexOf("Отклонение") === 0) return num >= 0 ? "good" : "bad";
  return "";
}

function makeFilter(col, values, selected, onChange) {
  const wrap = el("div", "filter");
  const btn = el("button", "filter-btn");
  btn.type = "button";
  const panel = el("div", "filter-panel");
  panel.hidden = true;
  const search = el("input");
  search.placeholder = "Поиск значения...";
  const list = el("div");
  panel.appendChild(search);
  panel.appendChild(list);
  function paint() {
    btn.textContent = DIM_LABELS[col] + (selected.length ? ": " + selected.length : "");
    btn.classList.toggle("active", selected.length > 0);
    list.innerHTML = "";
    const q = search.value.toLowerCase();
    values.filter(v => String(v).toLowerCase().indexOf(q) >= 0).forEach(v => {
      const label = el("label");
      const cb = el("input");
      cb.type = "checkbox";
      cb.checked = selected.indexOf(v) >= 0;
      cb.addEventListener("change", () => {
        if (cb.checked) { if (selected.indexOf(v) < 0) selected.push(v); }
        else { selected.splice(selected.indexOf(v), 1); }
        paint();
        onChange();
      });
      label.appendChild(cb);
      label.appendChild(el("span", null, String(v)));
      list.appendChild(label);
    });
  }
  search.addEventListener("input", paint);
  btn.addEventListener("click", e => { e.stopPropagation(); panel.hidden = !panel.hidden; });
  panel.addEventListener("click", e => e.stopPropagation());
  paint();
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  return wrap;
}

document.addEventListener("click", () => {
  document.querySelectorAll(".filter-panel").forEach(p => { p.hidden = true; });
});

function scheduleRebuild(host) {
  clearTimeout(host._timer);
  host._timer = setTimeout(async () => {
    const res = await fetch("/api/rebuild", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: state.sessionId,
                            filters: host._state.filters,
                            toggles: host._state.toggles})
    });
    if (!res.ok) return;
    const payload = await res.json();
    state.sessionId = payload.session_id;
    renderDashboard(payload, host);
  }, 300);
}

function makeSelect(options, value, onChange) {
  const wrap = el("div", "filter");
  const btn = el("button", "filter-btn");
  btn.type = "button";
  const panel = el("div", "filter-panel");
  panel.hidden = true;
  const list = el("div");
  panel.appendChild(list);
  function paint() {
    const cur = options.find(o => o.value === value);
    btn.textContent = cur ? cur.label : "";
    list.innerHTML = "";
    options.forEach(o => {
      const item = el("button", "select-option" + (o.value === value ? " selected" : ""), o.label);
      item.type = "button";
      item.addEventListener("click", e => {
        e.stopPropagation();
        value = o.value;
        panel.hidden = true;
        paint();
        onChange(o.value);
      });
      list.appendChild(item);
    });
  }
  btn.addEventListener("click", e => { e.stopPropagation(); panel.hidden = !panel.hidden; });
  panel.addEventListener("click", e => e.stopPropagation());
  paint();
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  return wrap;
}

function renderDashboard(payload, host) {
  host.querySelectorAll(".chart").forEach(node => {
    if (window.Plotly) Plotly.purge(node);
  });
  host.innerHTML = "";
  host.classList.add("dashboard");
  host._state = {
    filters: Object.assign({}, payload.config.filters || {}),
    toggles: {dimension: payload.config.dimension, granularity: payload.config.granularity,
              metric: payload.config.metric || null}
  };
  const options = payload.filter_options || {};

  const kpis = el("div", "kpis");
  (payload.kpis || []).forEach(kpi => {
    const card = el("div", "kpi " + kpiClass(kpi));
    card.appendChild(el("div", "label", kpi.label));
    card.appendChild(el("div", "value", kpi.value));
    kpis.appendChild(card);
  });
  host.appendChild(kpis);

  const controls = el("div", "controls");
  const dims = ["region_name", "outlet_name", "product_name", "category"];
  if (options.client_name) dims.push("client_name");
  const dimSelect = makeSelect(dims.map(d => ({value: d, label: DIM_LABELS[d]})),
                               host._state.toggles.dimension, v => {
    host._state.toggles.dimension = v;
    scheduleRebuild(host);
  });
  controls.appendChild(el("span", "ctl-label", "Разрез:"));
  controls.appendChild(dimSelect);
  const granSelect = makeSelect(Object.keys(GRAN_LABELS).map(g => ({value: g, label: GRAN_LABELS[g]})),
                                host._state.toggles.granularity, v => {
    host._state.toggles.granularity = v;
    scheduleRebuild(host);
  });
  controls.appendChild(el("span", "ctl-label", "Период:"));
  controls.appendChild(granSelect);
  const mcols = (payload.table && payload.table.columns) || [];
  const mlabels = (payload.table && payload.table.labels) || [];
  const metricSelect = makeSelect(mcols.slice(2).map((c, i) => ({value: c, label: mlabels[i + 2] || c})),
                                  host._state.toggles.metric || mcols[2] || "", v => {
    host._state.toggles.metric = v;
    scheduleRebuild(host);
  });
  controls.appendChild(el("span", "ctl-label", "Метрика:"));
  controls.appendChild(metricSelect);
  FILTER_ORDER.forEach(col => {
    if (!options[col]) return;
    const selected = host._state.filters[col] || (host._state.filters[col] = []);
    controls.appendChild(makeFilter(col, options[col], selected, () => scheduleRebuild(host)));
  });
  host.appendChild(controls);

  const charts = el("div", "charts");
  const boxes = (payload.charts || []).map(spec => {
    const box = el("div", "chart");
    box._spec = spec;
    charts.appendChild(box);
    return box;
  });
  host.appendChild(charts);
  requestAnimationFrame(() => {
    boxes.forEach(box => {
      Plotly.newPlot(box, box._spec.data, Object.assign({}, box._spec.layout, {autosize: true}),
                     {responsive: true, displaylogo: false});
    });
    scrollDown();
  });

  if (payload.summary) host.appendChild(el("div", "summary", payload.summary));

  if (payload.table) {
    const details = el("details");
    details.appendChild(el("summary", null, "Таблица: " + payload.table.total_rows + " строк"));
    renderTable(payload.table, details);
    host.appendChild(details);
  }
  scrollDown();
}

function renderPayload(payload, bubble) {
  if (payload.kind === "dashboard") {
    renderDashboard(payload, bubble);
    return;
  }
  bubble.textContent = payload.text || "";
  if (payload.kind === "list" && payload.dashboards) {
    const list = el("div", "dash-list");
    payload.dashboards.forEach(d => {
      const row = el("div", "dash-row");
      row.appendChild(el("span", null, d.name + " (" + d.updated + ")"));
      const btn = el("button", null, "Открыть");
      btn.type = "button";
      btn.addEventListener("click", () => send("открой дашборд «" + d.name + "»"));
      row.appendChild(btn);
      list.appendChild(row);
    });
    bubble.appendChild(list);
  }
  if (payload.kind === "table" && payload.table) {
    bubble.classList.add("table-msg");
    renderTable(payload.table, bubble);
  }
  if (payload.file_url) {
    const link = el("a", "file-link", "Скачать файл");
    link.href = payload.file_url;
    link.setAttribute("download", "");
    bubble.appendChild(document.createElement("br"));
    bubble.appendChild(link);
  }
}

async function send(text) {
  appendUser(text);
  const bubble = appendBot();
  bubble.classList.add("typing");
  bubble.textContent = "Думаю...";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: state.sessionId, text: text})
    });
    const payload = await res.json();
    bubble.classList.remove("typing");
    state.sessionId = payload.session_id;
    renderPayload(payload, bubble);
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.textContent = "Сервер недоступен. Запустите uvicorn и повторите запрос.";
  }
  scrollDown();
}

document.getElementById("composer").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send(text);
});

const EXAMPLES = [
  "Собери дашборд по продажам: план-факт по регионам за последний год",
  "покажи скидки по клиенту за последние 3 года",
  "что ты умеешь"
];
const hints = document.getElementById("hints");
EXAMPLES.forEach(text => {
  const btn = el("button", null, text);
  btn.type = "button";
  btn.addEventListener("click", () => send(text));
  hints.appendChild(btn);
});

const hello = appendBot();
hello.textContent = "Здравствуйте. Я строю интерактивные дашборды по текстовому запросу: " +
  "план-факт продаж, скидки, вычисления колонками, фильтры и переключатели. " +
  "Начните с примера ниже или напишите свой вопрос.";
</script>
</body>
</html>
